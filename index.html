<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K.KCHI가 디자인합니다.</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d3827; /* 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            position: relative;
        }
        .card-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 명함 이미지 (77.png) -->
        <img src="77.png" alt="K.KCHI 모바일 명함" usemap="#card-map">

        <!-- 아이콘 위치별 클릭 영역 설정 (전화, 톡, 지도) -->
        <map name="card-map">
            <!-- 1. 전화 아이콘 영역 (왼쪽) -->
            <area shape="rect" coords="200,700,270,770" href="tel:010-0000-0000" alt="전화하기">
            
            <!-- 2. 톡 아이콘 영역 (가운데) -->
            <area shape="rect" coords="450,700,530,770" href="https://open.kakao.com/o/xxxxxx" target="_blank" alt="카카오톡 오픈채팅">
            
            <!-- 3. 지도 아이콘 영역 (오른쪽) -->
            <area shape="rect" coords="710,700,780,770" href="https://map.naver.com" target="_blank" alt="오시는 길 지도">
        </map>
    </div>

</body>
</html>
