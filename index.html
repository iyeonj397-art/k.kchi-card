<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K.Kchi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f5f5f5;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    position: relative;
    width: min(100vw, calc(100svh * 930 / 1654));
    aspect-ratio: 930 / 1654;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

.card img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

.card a {
    position: absolute;
    display: block;
    z-index: 10;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* 전화 */
.phone {
    left: 19.5%;
    top: 70.2%;
    width: 6.5%;
    height: 5%;
}

/* 카카오톡 */
.kakao {
    left: 44.5%;
    top: 69.8%;
    width: 10%;
    height: 5.2%;
}

/* 지도 */
.map {
    left: 72%;
    top: 69.8%;
    width: 9%;
    height: 5.2%;
}
</style>
</head>

<body>

<div class="card">
    <img src="77.png" alt="K.Kchi">

    <a class="phone"
       href="tel:01049093255"
       aria-label="전화"></a>

    <a class="kakao"
       href="https://open.kakao.com/o/svqF8CXi"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="카카오톡"></a>

    <a class="map"
       href="https://map.naver.com/p/entry/place/11623136?lng=127.7342621&lat=37.8792083&placePath=%2Fhome%3Ffrom%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76%26timestamp%3D202611211540%26locale%3Dko%26svcName%3Dmap_pcv5&entry=pll&searchType=place&c=15.00,0,0,0,dh"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="지도"></a>
</div>

</body>
</html>
